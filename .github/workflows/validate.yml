name: validate-catalog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify catalog against npm and public repos
        run: node scripts/verify.mjs
