name: compose-catalog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Runners ship npm + yarn but not pnpm. The official runtime staging and
      # the `dsh plugin add` chain both want pnpm (npm's resolver stalls on the
      # 60+ subpackage kernel tree), so install it explicitly.
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install and compose every catalog plugin on the official chain
        run: node scripts/compose-check.mjs
