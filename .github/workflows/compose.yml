name: compose-catalog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * *'

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and compose every catalog plugin on the official chain
        run: node scripts/compose-check.mjs
